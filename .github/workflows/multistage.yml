name: MULTI-STAGE-CICD
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  validate-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validating dev
        run: echo 'validating the project to dev'
  dev:
    needs: validate-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run a dev environment
        run: echo 'deploying dev environment'
  qa:
    needs: validate-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run a qa envirnment
        run: echo 'deploying qa environment'
  prod:
    needs: validate-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run a prod environment
        run: echo 'deploying prod environment'
